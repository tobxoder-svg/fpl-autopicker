name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; a queued run supersedes an older one rather
# than racing it.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Model regression tests. Cheap, and they pin the small-sample bug that a
      # one-minute substitute can out-project a regular starter.
      - run: npm test

      # `prebuild` snapshots the live API and falls back to the committed bundle
      # if the API is unreachable, so a build never fails on a bad API minute.
      - run: npm run build
        env:
          # Repository page served from https://<user>.github.io/<repo>/.
          # For a custom domain or a <user>.github.io repo, set this to "/".
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

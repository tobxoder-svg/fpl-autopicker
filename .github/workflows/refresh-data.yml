name: Refresh FPL data

# The FPL API sends no CORS headers, so the browser cannot call it. This job is
# the data pipeline: it snapshots the API into the repo, and the push triggers a
# redeploy. Prices settle at about 02:30 UK, so the early-morning run is the one
# that matters; the others keep injury flags and ownership current.
on:
  schedule:
    - cron: "15 3 * * *" # 03:15 UTC — after the nightly price changes
    - cron: "15 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Snapshot the FPL API
        # fetch-fpl.mjs asserts on the result and exits non-zero rather than
        # committing a bundle that would render every projection NaN.
        run: node scripts/fetch-fpl.mjs

      # Optional: bookmaker odds for the Autopilot tab's captain pick. Needs the
      # ODDS_API_KEY secret (free at the-odds-api.com, 2 credits a run). Skipped
      # without it; a failure never blocks the FPL snapshot.
      - name: Snapshot bookmaker odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then echo "No ODDS_API_KEY — skipping odds."; exit 0; fi
          npm ci --no-audit --no-fund
          npx tsx scripts/fetch-odds.ts

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/bundle.json
          if [ -f public/data/odds.json ]; then git add public/data/odds.json; fi
          if git diff --staged --quiet; then
            echo "No change in the snapshot — nothing to commit."
          else
            git commit -m "chore(data): refresh FPL snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
